version: 2

sources:
  - name: customer_data
    database: snow_db                # 👈 replace with your Snowflake database
    schema: cust        # 👈 replace with your Snowflake schema
    tables:
      - name: customers_external1
        external:
          location: "@snow_db.cust.snowflake_stage_2025"
          file_format: "snow_db.cust.csv_format_latest1"

          row_format: delimited
          delimiter: ","
          skip_header: 1
          columns:
            - name: index
              data_type: varchar
              external_expression: "VALUE:c1::VARCHAR"
            - name: customer_id
              data_type: varchar
              external_expression: "VALUE:c2::VARCHAR"
            - name: first_name
              data_type: varchar
              external_expression: "VALUE:c3::VARCHAR"
            - name: last_name
              data_type: varchar
              external_expression: "VALUE:c4::VARCHAR"
            - name: company 
              data_type: varchar
              external_expression: "VALUE:c5::VARCHAR"
            - name: city
              data_type: varchar
              external_expression: "VALUE:c6::VARCHAR"
            - name: country
              data_type: varchar
              external_expression: "VALUE:c7::VARCHAR"
            - name: phone_1
              data_type: varchar
              external_expression: "VALUE:c8::VARCHAR"
            - name: phone_2
              data_type: varchar
              external_expression: "VALUE:c9::VARCHAR"
            - name: email
              data_type: varchar
              external_expression: "VALUE:c10::VARCHAR"
            - name: subscription_date
              data_type: varchar
              external_expression: "VALUE:c11::VARCHAR"
            - name: website
              data_type: varchar
              external_expression: "VALUE:c12::VARCHAR"